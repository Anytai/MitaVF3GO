name: Deploy MiTa VF3 GO

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Supabase config
        run: |
          sed -i "s|SUPABASE_URL_HERE|${{ secrets.SUPABASE_URL }}|g" index.html
          sed -i "s|SUPABASE_ANON_KEY_HERE|${{ secrets.SUPABASE_KEY }}|g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
