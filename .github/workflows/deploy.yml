name: Deploy MiTa VF3 GO

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Inject Supabase config into HTML
        run: |
          sed -i "s|SUPABASE_URL_HERE|${{ secrets.SUPABASE_URL }}|g" index.html
          sed -i "s|SUPABASE_ANON_KEY_HERE|${{ secrets.SUPABASE_KEY }}|g" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
